services:
  frontend:
    build: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  backend:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file: .env
    environment:
      # Aqui eu passo as variáveis de ambiente pro Django saber exatamente onde achar o Postgres dentro do Docker
      - DB_NAME=ai4po_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db  # O host é 'db' porque é o nome do container do banco na mesma rede Docker
      - DB_PORT=5432
      # Ollama roda fora do Docker (na máquina), então o container acessa pelo host
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - db      # Faço o backend esperar o container do banco subir antes de iniciar
  
  db:
    image: pgvector/pgvector:pg16
    container_name: ai4po_db
    restart: always
    environment:
      POSTGRES_DB: ai4po_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"  # Exponho a porta 5432 para conseguir conectar via DBeaver/psql ou rodar comandos locais
    volumes:
      - pgdata:/var/lib/postgresql/data  # Garante que os dados e tabelas não sumam quando o container reiniciar

volumes:
  pgdata: