  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   entrypoint: ["/bin/sh", "-c"]
  #   command: >
  #     "ollama serve & sleep 3 && ollama pull llama3.1 && echo 'modelo pronto'"
  #   depends_on:
  #     - ollama

volumes:
  ollama_data: