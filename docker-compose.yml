services:
  frontend:
    build: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

  backend:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Aqui eu passo as variáveis de ambiente pro Django saber exatamente onde achar o Postgres dentro do Docker
      - PYTHONUNBUFFERED=1
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${POSTGRES_HOST}
      - DB_PORT=${POSTGRES_PORT}
      # Ollama roda fora do Docker (na máquina), então o container acessa pelo host
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=ai4po-model
    depends_on:
      db:
        condition: service_healthy # Aguarda o healthcheck do 'db' indicar sucesso

  db:
    image: pgvector/pgvector:pg16
    container_name: ai4po_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # Exponho a porta 5432 para conseguir conectar via DBeaver/psql ou rodar comandos locais
    volumes:
      - pgdata:/var/lib/postgresql/data # Garante que os dados e tabelas não sumam quando o container reiniciar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
