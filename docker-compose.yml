  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   entrypoint: ["/bin/sh", "-c"]
  #   command: >
  #     "ollama serve & sleep 3 && ollama pull qwen3.5:4b && echo 'modelo pronto'"
  #   depends_on:
  #     - ollama

volumes:
  ollama_data:
  postgres_data: