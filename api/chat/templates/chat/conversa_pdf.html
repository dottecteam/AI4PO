<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @page {
        size: A4;
        margin: 2cm;
        @bottom-right {
          content: counter(page) " / " counter(pages);
          font-size: 9pt;
          color: #888;
        }
      }
      body {
        font-family: sans-serif;
        font-size: 11pt;
        color: #222;
      }
      h1 {
        font-size: 18pt;
        margin-bottom: 4px;
      }
      .meta {
        color: #777;
        font-size: 9pt;
        margin-bottom: 24px;
      }
      .msg {
        margin-bottom: 14px;
        padding: 10px 12px;
        border-radius: 6px;
        page-break-inside: avoid;
      }
      .user {
        background: #eef3ff;
      }
      .assistant {
        background: #f4f4f4;
      }
      .autor {
        font-weight: bold;
        font-size: 9pt;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .conteudo {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>{{ conversa.titulo|default:"Conversa" }}</h1>
    <div class="meta">Exportado em {{ agora|date:"d/m/Y H:i" }}</div>

    {% for m in mensagens %}
    <div class="msg {{ m.role }}">
      <div class="autor">
        {% if m.role == "user" %}Você{% else %}Assistente{% endif %}
      </div>
      <div class="conteudo">{{ m.conteudo }}</div>
    </div>
    {% endfor %}
  </body>
</html>
